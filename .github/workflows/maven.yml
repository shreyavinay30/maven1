name:Java CI/CD Pipeline

on:
     push:
         branches: ["main"]
     pull_request:
         branches: ["main"]
     workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
     
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

           - name: Set up JDK 25
             uses: actions/setup-jdk@v4
             with:
               java-version: '25'
               distribution: 'temurin'

           - name: Compile Java Program 
             run: javac new.java
     

       
 